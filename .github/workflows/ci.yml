name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run prek
        uses: j178/prek-action@v2

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.0"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - django-version: "4.2"
            python-version: "3.13"
          - django-version: "4.2"
            python-version: "3.14"
          - django-version: "5.0"
            python-version: "3.13"
          - django-version: "5.0"
            python-version: "3.14"
          - django-version: "5.1"
            python-version: "3.14"
          - django-version: "6.0"
            python-version: "3.10"
          - django-version: "6.0"
            python-version: "3.11"
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: requirements.txt
          enable-cache: true
      - name: Install dependencies
        run: |
          uv pip install -e .
          uv pip install -r requirements.txt
          uv pip install django~=${{ matrix.django-version }}
      - name: Run tests
        run: python -m coverage run runtests.py
      - name: Generate coverage report
        run: python -m coverage xml
      - name: Coveralls
        uses: coverallsapp/github-action@v2

  checks:
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Check all jobs passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]

  release:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs: [test]
    environment:
      name: pypi
      url: https://pypi.org/p/django-rq-email-backend
    permissions:
      id-token: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build package
        run: uv build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
